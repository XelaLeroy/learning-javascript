<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon menu</title>
    <!-- font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"

    <link rel="stylesheet" href="style.css" />

              </header>
              <div class="item-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nisi, deleniti hic? Deserunt, minima. Dolor veritatis quo ducimus aut necessitatibus aperiam neque culpa velit vel omnis.</div>
            </div>

        </div>
         
       
      </section>
    <!-- javascript -->
    <script src="app.js"></script>
  </body>
</html>
